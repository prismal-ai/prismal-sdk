name: Release

# Publishes `prismal-ai-sdk` (import `prismal_sdk`) to PyPI from `main`
# (SPEC-CS3-REL-001).
#
# Every push to `main` (in practice: merging the develop → main PR) runs this
# workflow. It publishes the version in pyproject.toml when that version is a
# final release and is not on PyPI yet, then tags `v<version>` and creates the
# GitHub release. Anything else (a `.devN` version, a version already
# uploaded) ends green without publishing, so re-runs are harmless.
#
# Publishing uses PyPI trusted publishing (OIDC): no token is stored in the
# repository. PyPI must list this publisher once — project
# `prismal-ai-sdk`, owner `prismal-ai`, repository `prismal-sdk`, workflow
# `release.yml`, environment `pypi`
# (https://pypi.org/manage/account/publishing/, "pending publisher" while
# the project does not exist on PyPI yet).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.decide.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Decide whether this version ships
        id: decide
        run: |
          set -euo pipefail
          version="$(uv version --short)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # PEP 440 final releases only: no .devN / aN / bN / rcN / +local.
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)*(\.post[0-9]+)?$ ]]; then
            echo "::notice::${version} is not a final release; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/prismal-ai-sdk/${version}/json")"
          if [ "$status" = "200" ]; then
            echo "::notice::prismal-ai-sdk ${version} is already on PyPI; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "404" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::PyPI answered ${status} for prismal-ai-sdk ${version}"
            exit 1
          fi

  publish:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/prismal-ai-sdk/${{ needs.plan.outputs.version }}/
    permissions:
      # OIDC token for PyPI trusted publishing.
      id-token: write
      # Push the `v<version>` tag and create the GitHub release.
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      # The tag must not exist yet: PyPI uploads are immutable, and a tag
      # pointing elsewhere would describe a different artifact.
      - name: Check the release tag is free
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::tag v${VERSION} already exists but ${VERSION} is not on PyPI"
            exit 1
          fi

      - name: Install
        run: uv sync --extra dev --locked

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      - name: Unit tests (no network) + coverage floor
        run: uv run pytest -m "not contract" --cov --cov-report=term-missing

      - name: Build
        run: uv build

      # Catches what the unit suite cannot: files missing from the artifacts.
      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl scripts/smoke_test.py

      - name: Smoke test (source distribution)
        run: uv run --isolated --no-project --with dist/*.tar.gz scripts/smoke_test.py

      - name: Publish to PyPI (trusted publishing)
        run: uv publish

      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" dist/* \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --notes "prismal-ai-sdk ${VERSION} — https://pypi.org/project/prismal-ai-sdk/${VERSION}/ · see CHANGELOG.md"
