name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # Lets the contract job be re-run on demand against a chosen host version.
  workflow_dispatch:
    inputs:
      server_version:
        description: "prismal-server version from PyPI to test against (fake-LLM mode)"
        required: false
        default: ""

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install
      # `uv pip install --system` targets the runner's Debian Python, which is
      # externally managed (PEP 668) and refuses the install. Sync into the
      # project venv instead; `uv run` picks it up. `--locked` additionally
      # fails the build if uv.lock has drifted from pyproject.toml.
      - name: Install
        run: uv sync --extra dev --locked
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src
      - name: Unit tests (no network) + coverage floor
        run: uv run pytest -m "not contract" --cov --cov-report=term-missing

  contract:
    runs-on: ubuntu-latest
    # The release gate (SPEC-CS3-CTR-001, supersedes CS2-00-04): the published
    # prismal-server wheel from PyPI, started in fake-LLM mode, so the suite
    # needs no provider credentials and no private container image. Runs on
    # every pull request and on dispatch.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    env:
      PRISMAL_BASE_URL: http://localhost:8000
      HOST_REQUIREMENT: ${{ inputs.server_version && format('prismal-server=={0}', inputs.server_version) || 'prismal-server>=0.3,<0.4' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python
        run: uv python install
      - name: Install
        run: uv sync --extra dev --extra ws --locked
      # Its own venv: the host (and the engine it pulls in) needs Python 3.13
      # and must never leak into the SDK's environment (CLAUDE.md hard rule).
      - name: Install prismal-server from PyPI
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/host"
          uv pip install --python "$RUNNER_TEMP/host/bin/python" "$HOST_REQUIREMENT"
          uv pip list --python "$RUNNER_TEMP/host/bin/python" | grep -i '^prismal'
      - name: Start prismal-server (fake-LLM mode)
        env:
          PRISMAL_SERVER_HOST_FAKE_LLM_MODE: "true"
          PRISMAL_SERVER_HOST_ENVIRONMENT: development
          PRISMAL_SERVER_HOST_WS_ENABLED: "true"
          PRISMAL_SERVER_HOST_AGUI_ENABLED: "true"
          PRISMAL_SERVER_HOST_ADMIN_ENABLED: "true"
          # Engine flag: without it the host refuses AG-UI with
          # `protocol_not_enabled` even when HOST_AGUI_ENABLED is true.
          PRISMAL_AGUI_EVENTS_ENABLED: "true"
        run: |
          nohup "$RUNNER_TEMP/host/bin/uvicorn" prismal_server.app:app \
            --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/host.log" 2>&1 &
      # The suite skips (exit 0) when no host answers; in this job a skip
      # would be a false green, so assert the fake-mode host is really up.
      - name: Assert fake-LLM host is up
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS -D - -o /dev/null "$PRISMAL_BASE_URL/healthz" \
                | grep -qi '^x-prismal-fake-llm: 1'; then
              echo "fake-LLM host is up"; exit 0
            fi
            sleep 1
          done
          echo "::error::prismal-server did not come up in fake-LLM mode"
          cat "$RUNNER_TEMP/host.log"
          exit 1
      - name: Contract suite
        run: uv run pytest -m contract
      - name: Host log
        if: always()
        run: cat "$RUNNER_TEMP/host.log" || true
