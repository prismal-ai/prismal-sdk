name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # Required for the opt-in `contract` job below, which gates on this event.
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: Install
        run: uv pip install -e ".[dev]" --system
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src
      - name: Unit tests (no network) + coverage floor
        run: uv run pytest -m "not contract" --cov --cov-report=term-missing

  contract:
    runs-on: ubuntu-latest
    # Opt-in: only runs when explicitly dispatched, since it needs a live
    # prismal-server instance. See tests/contract/test_contract_smoke.py.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install
        run: uv pip install -e ".[dev]" --system
      - name: Contract suite
        run: uv run pytest -m contract
